<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dot Dash</title>
<style>
  :root { --bg: #0b1020; --fg: #e8ecff; --muted: #8a93b8; --accent: #7cf29a; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px; touch-action: none; user-select: none;
  }
  h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: 2px; color: var(--accent); }
  #hud { display: flex; gap: 24px; font-size: 16px; margin-bottom: 8px; color: var(--muted); }
  #hud b { color: var(--fg); }
  canvas { width: min(100%, 630px); height: auto; image-rendering: pixelated; border-radius: 8px; }
  #help { margin-top: 10px; font-size: 14px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<h1>DOT DASH</h1>
<div id="hud">
  <span>Score <b id="score">0</b></span>
  <span>Level <b id="level">1</b></span>
  <span>Lives <b id="lives">3</b></span>
</div>
<canvas id="game"></canvas>
<div id="help">Arrow keys or WASD to move · Swipe on a phone · P to pause</div>

<script>
// ---------- The maze ----------
// Each row lists the left half plus the middle column; the right half is a mirror image.
// #=wall  .=dot  o=power orb  -=door of the bots' garage  (space)=empty floor
const LEFT_HALF = [
  "###########",
  "#o....#....",
  "#.###.#.##.",
  "#..........",
  "#.##.####.#",
  "#....#.....",
  "####.#.####",
  "#....#.....",
  "####.#.###-",
  ".......#   ",
  "####.#.####",
  "#..........",
  "#.##.###.##",
  "#o.#.......",
  "##.#.#.###.",
  "#....#.....",
  "#.#######.#",
  "#..........",
  "###########",
];
const MAP = LEFT_HALF.map(l => l + l.slice(0, 10).split("").reverse().join(""));
const ROWS = MAP.length, COLS = MAP[0].length, TILE = 24;

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = COLS * TILE;
canvas.height = ROWS * TILE;

const DIRS = { left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] };
const OPPOSITE = { left: "right", right: "left", up: "down", down: "up" };

let grid, dotsLeft, score = 0, lives = 3, level = 1;
let player, bots, frightTimer = 0, botsEatenCombo = 0;
let state = "ready", stateTimer = 2, paused = false, popups = [];

function tileAt(x, y) {
  if (y < 0 || y >= ROWS) return "#";
  x = (x + COLS) % COLS;              // tunnel on the sides wraps around
  return grid[y][x];
}
const isOpen = (x, y) => { const t = tileAt(x, y); return t !== "#" && t !== "-"; };

function resetMaze() {
  grid = MAP.map(r => r.split(""));
  dotsLeft = grid.flat().filter(t => t === "." || t === "o").length;
}

function resetActors() {
  player = { x: 10, y: 13, dir: "left", want: "left", speed: 6.5 };
  const base = 5.2 + level * 0.35;
  bots = [
    { name: "Ember", color: "#ff5d5d", x: 10, y: 7, dir: "left",  wait: 0,  mode: "hunt" },
    { name: "Plum",  color: "#c77dff", x: 9,  y: 9, dir: "up",    wait: 3,  mode: "ahead" },
    { name: "Frost", color: "#4dd6ff", x: 10, y: 9, dir: "up",    wait: 6,  mode: "random" },
    { name: "Zest",  color: "#ffb347", x: 11, y: 9, dir: "up",    wait: 9,  mode: "shy" },
  ].map(b => ({ ...b, speed: base, home: { x: b.x, y: b.y }, eaten: false }));
  frightTimer = 0;
}

function newGame() {
  score = 0; lives = 3; level = 1;
  resetMaze(); resetActors();
  state = "ready"; stateTimer = 2;
  updateHud();
}

function updateHud() {
  document.getElementById("score").textContent = score;
  document.getElementById("level").textContent = level;
  document.getElementById("lives").textContent = lives;
}

// ---------- Movement ----------
// Actors move along tile centres. When they arrive on a centre they may turn.
function step(actor, dist, chooseDir) {
  while (dist > 0) {
    const cx = Math.round(actor.x), cy = Math.round(actor.y);
    const atCentre = Math.abs(actor.x - cx) < 1e-6 && Math.abs(actor.y - cy) < 1e-6;
    if (atCentre) {
      actor.x = cx; actor.y = cy;
      const d = chooseDir(actor, cx, cy);
      if (!d) return;                  // blocked: stand still
      actor.dir = d;
    }
    const [dx, dy] = DIRS[actor.dir];
    // distance to the next tile centre in the current direction
    const toNext = dx ? (dx > 0 ? Math.floor(actor.x) + 1 - actor.x : actor.x - Math.ceil(actor.x) + 1)
                      : (dy > 0 ? Math.floor(actor.y) + 1 - actor.y : actor.y - Math.ceil(actor.y) + 1);
    const move = Math.min(dist, toNext || 1);
    actor.x += dx * move; actor.y += dy * move;
    dist -= move;
    if (actor.x < -0.5) actor.x += COLS;
    if (actor.x > COLS - 0.5) actor.x -= COLS;
  }
}

function playerChoose(p, x, y) {
  eatAt(x, y);
  const [wx, wy] = DIRS[p.want];
  if (isOpen(x + wx, y + wy)) return p.want;
  const [dx, dy] = DIRS[p.dir];
  if (isOpen(x + dx, y + dy)) return p.dir;
  return null;
}

function botTarget(b) {
  const px = Math.round(player.x), py = Math.round(player.y);
  const [dx, dy] = DIRS[player.dir];
  switch (b.mode) {
    case "hunt":  return [px, py];
    case "ahead": return [px + dx * 4, py + dy * 4];
    case "shy": {
      const far = Math.hypot(b.x - px, b.y - py) > 7;
      return far ? [px, py] : [1, ROWS - 2];
    }
    default: return [Math.random() * COLS, Math.random() * ROWS];
  }
}

function botChoose(b, x, y) {
  const options = Object.keys(DIRS).filter(d => {
    if (d === OPPOSITE[b.dir]) return false;
    const [dx, dy] = DIRS[d];
    return isOpen(x + dx, y + dy);
  });
  if (!options.length) return OPPOSITE[b.dir];
  if (frightTimer > 0) return options[Math.floor(Math.random() * options.length)];
  const [tx, ty] = botTarget(b);
  let best = options[0], bestDist = Infinity;
  for (const d of options) {
    const [dx, dy] = DIRS[d];
    const dist = Math.hypot(x + dx - tx, y + dy - ty);
    if (dist < bestDist) { bestDist = dist; best = d; }
  }
  return best;
}

function eatAt(x, y) {
  x = (x + COLS) % COLS;
  const t = grid[y][x];
  if (t === ".") { score += 10; grid[y][x] = " "; dotsLeft--; }
  else if (t === "o") {
    score += 50; grid[y][x] = " "; dotsLeft--;
    frightTimer = Math.max(3, 8 - level * 0.5);
    botsEatenCombo = 0;
    bots.forEach(b => { if (b.wait <= 0) b.dir = OPPOSITE[b.dir]; });
  }
  updateHud();
  if (dotsLeft === 0) { state = "cleared"; stateTimer = 2; }
}

// ---------- Game loop ----------
function update(dt) {
  if (paused) return;
  if (state !== "play") {
    stateTimer -= dt;
    if (stateTimer <= 0) {
      if (state === "cleared") { level++; resetMaze(); resetActors(); updateHud(); state = "ready"; stateTimer = 2; }
      else if (state === "caught") {
        if (lives <= 0) { state = "over"; stateTimer = Infinity; }
        else { resetActors(); state = "ready"; stateTimer = 1.5; }
      }
      else if (state === "ready") state = "play";
    }
    popups.forEach(p => p.t -= dt);
    popups = popups.filter(p => p.t > 0);
    return;
  }

  step(player, player.speed * dt, playerChoose);

  if (frightTimer > 0) frightTimer -= dt;
  for (const b of bots) {
    if (b.wait > 0) {
      b.wait -= dt;
      if (b.wait <= 0) { b.x = 10; b.y = 7; b.dir = Math.random() < 0.5 ? "left" : "right"; b.eaten = false; }
      continue;
    }
    const speed = frightTimer > 0 ? b.speed * 0.55 : b.speed;
    step(b, speed * dt, botChoose);

    // collision
    const dist = Math.hypot(b.x - player.x, b.y - player.y);
    const wrapDist = Math.hypot(COLS - Math.abs(b.x - player.x), b.y - player.y);
    if (Math.min(dist, wrapDist) < 0.6) {
      if (frightTimer > 0) {
        botsEatenCombo++;
        const pts = 200 * 2 ** (botsEatenCombo - 1);
        score += pts; updateHud();
        popups.push({ x: b.x, y: b.y, text: pts, t: 1 });
        b.x = b.home.x; b.y = b.home.y; b.wait = 3; b.eaten = true;
      } else {
        lives--; updateHud();
        state = "caught"; stateTimer = 1.5;
        return;
      }
    }
  }
  popups.forEach(p => p.t -= dt);
  popups = popups.filter(p => p.t > 0);
}

// ---------- Drawing ----------
function drawMaze() {
  ctx.fillStyle = "#0b1020";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const t = grid[y][x], px = x * TILE, py = y * TILE;
    if (t === "#") {
      ctx.fillStyle = "#1d3b6e";
      ctx.beginPath(); ctx.roundRect(px + 2, py + 2, TILE - 4, TILE - 4, 5); ctx.fill();
      ctx.strokeStyle = "#3f7be0"; ctx.lineWidth = 1.5; ctx.stroke();
    } else if (t === "-") {
      ctx.fillStyle = "#7cf29a"; ctx.fillRect(px, py + TILE / 2 - 2, TILE, 4);
    } else if (t === ".") {
      ctx.fillStyle = "#ffe9a8";
      ctx.fillRect(px + TILE / 2 - 2, py + TILE / 2 - 2, 4, 4);
    } else if (t === "o") {
      const pulse = 5 + Math.sin(performance.now() / 150) * 1.5;
      ctx.fillStyle = "#ff8fd8";
      ctx.beginPath(); ctx.arc(px + TILE / 2, py + TILE / 2, pulse, 0, Math.PI * 2); ctx.fill();
    }
  }
}

// The player is a green blob with eyes that look where it is heading.
function drawPlayer() {
  const cx = player.x * TILE + TILE / 2, cy = player.y * TILE + TILE / 2;
  const squish = 1 + Math.sin(performance.now() / 80) * 0.06;
  ctx.fillStyle = "#7cf29a";
  ctx.beginPath(); ctx.ellipse(cx, cy, 10 * squish, 10 / squish, 0, 0, Math.PI * 2); ctx.fill();
  const [dx, dy] = DIRS[player.dir];
  for (const side of [-1, 1]) {
    const ex = cx + (dy ? side * 4 : dx * 3), ey = cy + (dx ? side * 4 : dy * 3) - (dx ? 1 : 0);
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(ex, ey, 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#0b1020"; ctx.beginPath(); ctx.arc(ex + dx * 1.2, ey + dy * 1.2, 1.5, 0, Math.PI * 2); ctx.fill();
  }
}

// The chasers are little robots with an antenna.
function drawBot(b) {
  const cx = b.x * TILE + TILE / 2, cy = b.y * TILE + TILE / 2;
  const scared = frightTimer > 0 && b.wait <= 0;
  const blink = scared && frightTimer < 2 && Math.floor(frightTimer * 6) % 2;
  const body = scared ? (blink ? "#ffffff" : "#3a4cff") : b.color;
  ctx.globalAlpha = b.wait > 0 && b.eaten ? 0.35 : 1;
  ctx.strokeStyle = body; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx, cy - 8); ctx.lineTo(cx, cy - 12); ctx.stroke();
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.arc(cx, cy - 12, 2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.roundRect(cx - 9, cy - 8, 18, 16, 4); ctx.fill();
  ctx.fillStyle = scared ? "#ffd1d1" : "#0b1020";
  ctx.fillRect(cx - 6, cy - 4, 12, 5);
  if (!scared) {
    const [dx] = DIRS[b.dir];
    ctx.fillStyle = "#fff";
    ctx.fillRect(cx - 4 + dx * 2, cy - 3, 3, 3);
    ctx.fillRect(cx + 1 + dx * 2, cy - 3, 3, 3);
  }
  ctx.globalAlpha = 1;
}

function drawBanner(text, sub) {
  ctx.fillStyle = "rgba(11,16,32,0.75)";
  ctx.fillRect(0, canvas.height / 2 - 40, canvas.width, sub ? 80 : 56);
  ctx.fillStyle = "#7cf29a"; ctx.textAlign = "center";
  ctx.font = "bold 28px system-ui, sans-serif";
  ctx.fillText(text, canvas.width / 2, canvas.height / 2 - 4);
  if (sub) {
    ctx.fillStyle = "#e8ecff"; ctx.font = "16px system-ui, sans-serif";
    ctx.fillText(sub, canvas.width / 2, canvas.height / 2 + 26);
  }
}

function draw() {
  drawMaze();
  bots.forEach(drawBot);
  if (state !== "caught" || Math.floor(stateTimer * 8) % 2) drawPlayer();
  ctx.font = "bold 14px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.fillStyle = "#fff";
  popups.forEach(p => ctx.fillText(p.text, p.x * TILE + TILE / 2, p.y * TILE));
  if (state === "ready") drawBanner(level === 1 ? "GET READY" : `LEVEL ${level}`);
  if (state === "cleared") drawBanner("MAZE CLEARED!");
  if (state === "over") drawBanner("GAME OVER", "Press Enter or tap to play again");
  if (paused) drawBanner("PAUSED", "Press P to keep going");
}

let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

// ---------- Controls ----------
const KEYS = {
  ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down",
  a: "left", d: "right", w: "up", s: "down",
};
window.addEventListener("keydown", e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (KEYS[k]) { player.want = KEYS[k]; if (KEYS[k] === OPPOSITE[player.dir]) player.dir = KEYS[k]; e.preventDefault(); }
  if (k === "p" && state !== "over") paused = !paused;
  if (k === "Enter" && state === "over") newGame();
});

let touchStart = null;
canvas.addEventListener("touchstart", e => {
  const t = e.touches[0]; touchStart = [t.clientX, t.clientY];
  if (state === "over") newGame();
}, { passive: true });
canvas.addEventListener("touchmove", e => {
  if (!touchStart) return;
  const t = e.touches[0], dx = t.clientX - touchStart[0], dy = t.clientY - touchStart[1];
  if (Math.hypot(dx, dy) < 20) return;
  const d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
  player.want = d; if (d === OPPOSITE[player.dir]) player.dir = d;
  touchStart = [t.clientX, t.clientY];
}, { passive: true });
canvas.addEventListener("click", () => { if (state === "over") newGame(); });

newGame();
requestAnimationFrame(loop);
</script>
</body>
</html>
